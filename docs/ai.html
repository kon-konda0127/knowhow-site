<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SNSで見たAI情報を、実際に試して採るか見送るかまで判定した記録。採用・見送りの理由まで残しています。">
  <title>AI検証 | アラフォーから始める趣味</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="ai-theme">
<div class="shell"><div class="site-frame">
  <aside class="rail"><span>試して、確かめて、採否を決める。</span></aside>
  <div class="main">

    <header class="topbar">
      <a class="brand" href="index.html">アラフォーから始める趣味</a>
      <button class="menu" id="menu" aria-label="メニュー" aria-expanded="false">☰</button>
      <nav class="nav" id="nav" aria-label="メインナビゲーション">
        <a href="index.html">はじめに</a>
        <a href="diet.html">ダイエット</a>
        <a href="ai.html" class="active">AI検証</a>
        <a href="column.html">コラム</a>
      </nav>
    </header>

    <div class="page">
      <div class="subhead">
        <div>
          <div class="crumb"><a href="index.html">ホーム</a>　›　AI検証</div>
          <h1>AI検証</h1>
          <p class="lead">SNSで見たAI情報を、実際に試して採るか見送るかまで判定した記録。</p>
        </div>
        <span class="eyebrow">AI VERIFY</span>
      </div>

      <div class="cat-stats" id="catStats"></div>
      <div id="featured"></div>
      <div class="filterbar" id="filterbar"></div>
      <div class="list-head-row" id="listHead" hidden>
        <span class="list-head-title">検証一覧</span>
        <span class="list-head-count" id="listCount" aria-live="polite"></span>
      </div>
      <div class="archive-grid" id="archive"></div>
    </div>

    <footer class="site-footer">
      <a href="index.html">← トップへ戻る</a>
    </footer>
  </div>
</div></div>

<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <button class="modal-close" id="modalClose" aria-label="閉じる">✕</button>
    <div class="modal-category" id="modalCategory"></div>
    <h2 id="modalTitle"></h2>
    <div class="modal-tags" id="modalTags"></div>
    <div class="modal-points" id="modalPoints"></div>
  </div>
</div>

<script src="notes-ai.js"></script>
<script>
  window.CATEGORY_CONFIG = {
    key: 'ai',
    label: 'AI検証',
    // 2026-08-16 並び順を「新しい記事が先頭」へ（社長判断・8/15）。
    // notes-ai.js は追記が末尾に積まれる運用のため、配列順のままだと最も古い記事が舞台パネルに出てしまう。
    // reverse() で「後に追記されたものが先」にしてから日付降順で安定ソートするので、
    // 結果は「日付の新しい順、同じ日付なら後から追記した順」になる。元データ（NOTES_AI）は書き換えない。
    data: typeof NOTES_AI !== 'undefined'
      ? [...NOTES_AI].reverse().sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')))
      : [],
    sections: [{ field: 'points', label: 'ポイント' }],
    // 2026-08-15 designerリデザイン統合（AI検証ページ限定のオプトイン。他カテゴリは未指定＝従来表示）
    featured: true,   // 先頭記事を藍の舞台パネルで上部中央に表示
    tagFold: true,    // タグを「上位チップ1行＋展開パネル」に畳む
    statsUnit: '検証' // 統計行の単位ラベル（AI検証カテゴリは「記事」ではなく「検証」）
  };
</script>
<script src="category.js"></script>
</body>
</html>
