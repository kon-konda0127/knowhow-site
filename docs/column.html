<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>コラム | アラフォーから始める趣味</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="column-theme">
<div class="site-layout">

  <!-- ===== サイドバー ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <a href="index.html">
        <div class="sidebar-logo-title">アラフォーから始める趣味</div>
        <div class="sidebar-logo-sub">学びを論点ごとに整理</div>
      </a>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">カテゴリ</div>
      <a href="index.html" class="sidebar-link">
        <span class="icon">🏠</span> トップ
      </a>
      <a href="dance.html" class="sidebar-link dance-link">
        <span class="icon">💃</span> ダンス
      </a>
      <a href="running.html" class="sidebar-link running-link">
        <span class="icon">🏃</span> ランニング
      </a>
      <a href="ai.html" class="sidebar-link ai-link">
        <span class="icon">🤖</span> AI開発
      </a>
      <a href="column.html" class="sidebar-link column-link active">
        <span class="icon">📝</span> コラム
      </a>
    </nav>
    <div class="sidebar-tags" id="sidebar-tags-container">
      <div class="sidebar-section-label">タグ</div>
      <div class="sidebar-tag-list" id="sidebar-tag-list"></div>
    </div>
  </aside>

  <!-- モバイルオーバーレイ -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ===== メインコンテンツ ===== -->
  <div class="main-content">

    <!-- モバイルトップバー -->
    <div class="topbar">
      <span class="topbar-title">📝 コラム</span>
      <button class="hamburger" id="hamburger" aria-label="メニューを開く">
        <span></span><span></span><span></span>
      </button>
    </div>

    <!-- ページヘッダー -->
    <header class="page-header header-column">
      <div class="page-header-inner">
        <a href="index.html" class="page-header-back">← トップへ</a>
        <h1>📝 コラム</h1>
        <p class="page-header-desc">実体験を「事実」と「考察」に分けて振り返る読み物</p>
      </div>
    </header>

    <!-- フィルターバー -->
    <div class="container">
      <div class="filter-bar">
        <span class="filter-label">タグで絞り込み：</span>
        <div class="tag-list" id="tag-filter"></div>
      </div>

      <!-- ノートグリッド -->
      <div class="note-grid" id="note-list">
        <p class="empty-msg">まだコラムがありません。</p>
      </div>
    </div>

    <footer class="site-footer">
      <a href="index.html">← トップへ戻る</a>
    </footer>
  </div>
</div>

<!-- ===== モーダル ===== -->
<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose" aria-label="閉じる">✕</button>
    <div class="modal-category" id="modalCategory"></div>
    <h2 id="modalTitle"></h2>
    <div class="modal-tags" id="modalTags"></div>
    <div class="modal-points">
      <h3>ポイント</h3>
      <ul id="modalPoints"></ul>
    </div>
    <a href="#" class="modal-link" id="modalLink">全文を読む →</a>
  </div>
</div>

<script src="notes-column.js"></script>
<script>
(function() {
  // ---- データ読み込み ----
  const notes = typeof NOTES_COLUMN !== 'undefined' ? NOTES_COLUMN : [];

  // ---- DOM参照 ----
  const noteList   = document.getElementById('note-list');
  const tagFilter  = document.getElementById('tag-filter');
  const sidebarTagList = document.getElementById('sidebar-tag-list');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalClose = document.getElementById('modalClose');
  const hamburger  = document.getElementById('hamburger');
  const sidebar    = document.getElementById('sidebar');
  const overlay    = document.getElementById('sidebarOverlay');

  let activeTag = null;

  // ---- タグ収集 ----
  const allTags = [...new Set(notes.flatMap(n => n.tags || []))];

  // ---- ハンバーガー ----
  function toggleSidebar() {
    const isOpen = sidebar.classList.toggle('open');
    overlay.classList.toggle('open', isOpen);
    hamburger.classList.toggle('open', isOpen);
  }
  hamburger.addEventListener('click', toggleSidebar);
  overlay.addEventListener('click', toggleSidebar);

  // ---- タグボタン生成 ----
  function buildTagButtons(container, sidebarMode) {
    if (!allTags.length) return;
    if (!sidebarMode) {
      const allBtn = document.createElement('button');
      allBtn.className = 'tag-btn active';
      allBtn.textContent = 'すべて';
      allBtn.dataset.tag = '';
      container.appendChild(allBtn);
    }
    allTags.forEach(tag => {
      const btn = document.createElement('button');
      btn.className = sidebarMode ? 'sidebar-tag' : 'tag-btn';
      btn.textContent = tag;
      btn.dataset.tag = tag;
      container.appendChild(btn);
    });
  }

  buildTagButtons(tagFilter, false);
  buildTagButtons(sidebarTagList, true);

  // ---- フィルター処理 ----
  function filterNotes(tag) {
    activeTag = tag || null;
    const cards = noteList.querySelectorAll('.note-card');
    tagFilter.querySelectorAll('.tag-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tag === (tag || ''));
    });
    cards.forEach(card => {
      const tags = JSON.parse(card.dataset.tags || '[]');
      const show = !tag || tags.includes(tag);
      if (show) {
        card.classList.remove('hiding');
        setTimeout(() => {
          card.style.display = '';
        }, 200);
      } else {
        card.classList.add('hiding');
        setTimeout(() => {
          card.style.display = 'none';
          card.classList.remove('hiding');
        }, 200);
      }
    });
  }

  tagFilter.addEventListener('click', e => {
    const btn = e.target.closest('.tag-btn');
    if (btn) filterNotes(btn.dataset.tag);
  });

  sidebarTagList.addEventListener('click', e => {
    const btn = e.target.closest('.sidebar-tag');
    if (btn) filterNotes(btn.dataset.tag);
  });

  // ---- モーダル ----
  function openModal(note) {
    document.getElementById('modalCategory').textContent = note.category || 'コラム';
    document.getElementById('modalTitle').textContent = note.title;
    const tagsEl = document.getElementById('modalTags');
    tagsEl.innerHTML = (note.tags || []).map(t =>
      `<span class="note-tag">${t}</span>`).join('');
    const pointsEl = document.getElementById('modalPoints');
    pointsEl.innerHTML = (note.points || []).map(p => `<li>${p}</li>`).join('');
    const linkEl = document.getElementById('modalLink');
    if (note.url) {
      linkEl.href = note.url;
      linkEl.style.display = 'inline-flex';
    } else {
      linkEl.style.display = 'none';
    }
    modalOverlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    modalOverlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  modalClose.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', e => {
    if (e.target === modalOverlay) closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  // ---- ノートカード生成 ----
  function buildCards() {
    if (!notes.length) return;
    noteList.innerHTML = '';

    notes.forEach((note, i) => {
      const card = document.createElement('div');
      card.className = 'note-card card-hidden';
      card.dataset.tags = JSON.stringify(note.tags || []);
      card.style.transitionDelay = `${i * 0.07}s`;

      const preview = note.points && note.points.length
        ? note.points[0]
        : '';

      card.innerHTML = `
        <h3>${note.title}</h3>
        ${preview ? `<p class="note-card-preview">${preview}</p>` : ''}
        <div class="tags">
          ${(note.tags || []).map(t => `<span class="note-tag">${t}</span>`).join('')}
        </div>
        <div class="note-card-footer">${note.category || 'コラム'}</div>
      `;

      card.addEventListener('click', () => openModal(note));
      noteList.appendChild(card);
    });

    // IntersectionObserver でフェードアップ
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.remove('card-hidden');
          entry.target.classList.add('card-visible');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });

    noteList.querySelectorAll('.note-card').forEach(card => io.observe(card));
  }

  buildCards();
})();
</script>
</body>
</html>
