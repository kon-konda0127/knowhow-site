<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダンス・ランニング ノウハウノート</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="site-title">ダンス・ランニング<br>ノウハウノート</h1>
      <p class="site-desc">動画から学んだ知見を論点ごとに整理した個人学習ノート</p>
    </div>
  </header>

  <main class="container">
    <div class="category-grid">
      <a href="dance.html" class="category-card dance">
        <div class="category-icon">💃</div>
        <h2>ダンス</h2>
        <p>アイソレーション・基礎・振り付けのコツ</p>
        <span class="note-count" id="dance-count">ノートを読む →</span>
      </a>
      <a href="running.html" class="category-card running">
        <div class="category-icon">🏃</div>
        <h2>ランニング</h2>
        <p>フォーム・トレーニングメニュー・補強</p>
        <span class="note-count" id="running-count">ノートを読む →</span>
      </a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>個人学習用ノート。出典は各ページに記載。</p>
    </div>
  </footer>
</body>
</html>
